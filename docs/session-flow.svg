<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 760 720" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Pi Session Refinement v2 chronological memory roll</title>
  <desc id="desc">A restrained two-column timeline runs down the left as checkpoints accumulate, moves right when memory reaches eighty percent, then continues down through consolidation and rolled memory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { fill:#f0f6fc; font-family:Arial, Helvetica, sans-serif; }
      .lane { font-size:10.5px; font-weight:700; letter-spacing:1.4px; fill:#8b949e; }
      .label { font-size:12px; font-weight:700; }
      .body { font-size:11px; fill:#c9d1d9; }
      .small { font-size:9.5px; fill:#8b949e; }
      .mono { font-family:"SFMono-Regular", Menlo, Consolas, monospace; }
      .line { fill:none; stroke:#8b949e; stroke-width:1.5; stroke-linecap:round; }
      .flow { fill:none; stroke:#8b949e; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .card { fill:#161b22; stroke:#8b949e; stroke-width:1.3; }
      .pill { fill:#1c2128; stroke:#6e7681; stroke-width:1; }
      .strong { fill:#21262d; stroke:#c9d1d9; stroke-width:1.2; }
    </style>
  </defs>

  <rect width="760" height="760" fill="#0d1117"/>
  <text x="40" y="29" class="lane">CHECKPOINTS ACCUMULATE</text>
  <path d="M60 48 L60 391" class="line"/>

  <!-- Left column -->
  <circle cx="60" cy="74" r="4" fill="#c9d1d9"/>
  <text x="88" y="70" class="label">Conversation</text>
  <rect x="88" y="81" width="116" height="10" rx="5" class="pill"/>
  <rect x="88" y="98" width="174" height="12" rx="6" class="pill"/>

  <circle cx="60" cy="151" r="4" fill="#c9d1d9"/>
  <text x="88" y="147" class="label">Checkpoint 1</text>
  <text x="88" y="165" class="small">new interval recorded</text>

  <circle cx="60" cy="222" r="4" fill="#c9d1d9"/>
  <text x="88" y="218" class="label">More conversation</text>
  <rect x="88" y="229" width="142" height="10" rx="5" class="pill"/>
  <rect x="88" y="246" width="190" height="12" rx="6" class="pill"/>

  <circle cx="60" cy="298" r="4" fill="#c9d1d9"/>
  <text x="88" y="294" class="label">Checkpoint 2</text>
  <text x="88" y="312" class="small">another interval recorded</text>

  <circle cx="60" cy="374" r="5" fill="#f0f6fc"/>
  <rect x="88" y="337" width="260" height="76" rx="9" class="card"/>
  <text x="106" y="361" class="label">Memory reaches 80%</text>
  <rect x="106" y="375" width="64" height="24" rx="5" class="pill"/>
  <text x="138" y="391" text-anchor="middle" class="small">checkpoint 1</text>
  <rect x="178" y="375" width="64" height="24" rx="5" class="pill"/>
  <text x="210" y="391" text-anchor="middle" class="small">checkpoint 2</text>
  <rect x="250" y="375" width="80" height="24" rx="5" class="strong"/>
  <text x="290" y="391" text-anchor="middle" class="small">new checkpoint</text>

  <!-- Move right once -->
  <path d="M350 375 L390 375 C414 375, 430 389, 430 408" class="flow"/>
  <text x="381" y="362" text-anchor="middle" class="small">roll</text>

  <!-- Right column -->
  <text x="420" y="340" class="lane">ROLL THE OLDEST MEMORY</text>
  <path d="M430 414 L430 690" class="flow"/>

  <circle cx="430" cy="414" r="4" fill="#c9d1d9"/>
  <text x="458" y="410" class="label">Select the old prefix</text>
  <rect x="458" y="422" width="210" height="28" rx="6" class="strong"/>
  <text x="563" y="440" text-anchor="middle" class="small">checkpoint 1 + checkpoint 2</text>

  <circle cx="430" cy="492" r="4" fill="#c9d1d9"/>
  <text x="458" y="488" class="label">Consolidate</text>
  <text x="458" y="506" class="body">Replace those old checkpoints with one compact record.</text>

  <circle cx="430" cy="568" r="4" fill="#c9d1d9"/>
  <text x="458" y="564" class="label">Rolled memory</text>
  <rect x="458" y="578" width="132" height="30" rx="6" class="strong"/>
  <text x="524" y="597" text-anchor="middle" class="small">consolidated past</text>
  <rect x="598" y="578" width="122" height="30" rx="6" class="pill"/>
  <text x="659" y="597" text-anchor="middle" class="small">recent checkpoint</text>

  <circle cx="430" cy="648" r="4" fill="#c9d1d9"/>
  <text x="458" y="644" class="label">Continue</text>
  <text x="458" y="662" class="body">New checkpoints append after the exact recent record.</text>

</svg>
