<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Pi Session Refinement v2 rolling memory flow</title>
  <desc id="desc">A dark flow diagram shows a conversation interval becoming a checkpoint, optional consolidation of the oldest whole-record prefix, transactional generation publication, prompt activation, and raw JSONL remaining canonical.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#c9d1d9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#6e7681" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { fill:#f0f6fc; font-family:Arial, Helvetica, sans-serif; }
      .lane { font-size:11px; font-weight:700; letter-spacing:1.5px; fill:#8b949e; }
      .label { font-size:11px; font-weight:700; letter-spacing:.45px; }
      .body { font-size:11px; fill:#c9d1d9; }
      .small { font-size:9.5px; fill:#8b949e; }
      .mono { font-family:"SFMono-Regular", Menlo, Consolas, monospace; }
      .card { fill:#161b22; stroke:#8b949e; stroke-width:1.4; }
      .engine { fill:#1b2430; stroke:#79c0ff; stroke-width:1.4; }
      .memory { fill:#18241f; stroke:#7ee787; stroke-width:1.4; }
      .warning { fill:#282319; stroke:#d29922; stroke-width:1.4; }
      .pill { fill:#21262d; stroke:#6e7681; stroke-width:1; }
      .exact { fill:#1f2733; stroke:#79c0ff; stroke-width:1; }
      .rolled { fill:#1b2a22; stroke:#7ee787; stroke-width:1; }
      .flow { fill:none; stroke:#c9d1d9; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .muted { fill:none; stroke:#6e7681; stroke-width:1.25; stroke-dasharray:5 5; stroke-linecap:round; marker-end:url(#arrowMuted); }
    </style>
  </defs>

  <rect width="900" height="620" fill="#0d1117"/>
  <text x="40" y="27" class="lane">LIVE SESSION</text>
  <text x="340" y="27" class="lane">ISOLATED MODEL WORK</text>
  <text x="650" y="27" class="lane">V2 MEMORY</text>

  <!-- New transcript interval -->
  <rect x="40" y="48" width="220" height="116" rx="10" class="card"/>
  <text x="58" y="70" class="label">NEW CONVERSATION INTERVAL</text>
  <rect x="58" y="83" width="112" height="13" rx="6" class="pill"/>
  <text x="180" y="94" class="small">user</text>
  <rect x="58" y="105" width="166" height="15" rx="7" class="exact"/>
  <text x="232" y="117" class="small">Pi</text>
  <rect x="58" y="132" width="92" height="16" rx="8" class="pill"/>
  <text x="104" y="143" text-anchor="middle" class="small mono">tool result</text>

  <path d="M262 106 L328 106" class="flow"/>
  <text x="295" y="94" text-anchor="middle" class="small">eligible</text>

  <!-- Examiner -->
  <rect x="330" y="58" width="230" height="96" rx="10" class="engine"/>
  <text x="445" y="82" text-anchor="middle" class="label">EXAMINER</text>
  <text x="445" y="101" text-anchor="middle" class="body">current memory + one new interval</text>
  <text x="445" y="119" text-anchor="middle" class="body">submits one checkpoint candidate</text>
  <text x="445" y="139" text-anchor="middle" class="small">no shell · no session tools · no extensions</text>

  <path d="M562 106 L638 106" class="flow"/>
  <text x="600" y="94" text-anchor="middle" class="small">stage</text>

  <!-- Candidate -->
  <rect x="640" y="48" width="220" height="116" rx="10" class="memory"/>
  <text x="658" y="70" class="label">COMPLETE CANDIDATE</text>
  <rect x="658" y="84" width="52" height="28" rx="6" class="pill"/>
  <text x="684" y="102" text-anchor="middle" class="small">older 1</text>
  <rect x="716" y="84" width="52" height="28" rx="6" class="pill"/>
  <text x="742" y="102" text-anchor="middle" class="small">older 2</text>
  <rect x="774" y="84" width="68" height="28" rx="6" class="exact"/>
  <text x="808" y="102" text-anchor="middle" class="small">new exact</text>
  <text x="750" y="133" text-anchor="middle" class="body">host validates the full staged memory</text>
  <text x="750" y="145" text-anchor="middle" class="small">below 80%: publish staged candidate</text>
  <text x="750" y="158" text-anchor="middle" class="small mono">at 80%: roll a legal prefix</text>

  <!-- Threshold split -->
  <path d="M700 166 C640 190, 165 180, 165 208" class="flow"/>
  <text x="445" y="183" text-anchor="middle" class="small">threshold reached</text>
  <path d="M860 140 C886 178, 886 344, 820 374" class="muted"/>

  <!-- Legal range selection -->
  <rect x="40" y="210" width="250" height="112" rx="10" class="warning"/>
  <text x="58" y="233" class="label">SELECT OLDEST LEGAL PREFIX</text>
  <rect x="58" y="248" width="64" height="30" rx="6" class="warning"/>
  <text x="90" y="267" text-anchor="middle" class="small">older 1</text>
  <rect x="128" y="248" width="64" height="30" rx="6" class="warning"/>
  <text x="160" y="267" text-anchor="middle" class="small">older 2</text>
  <rect x="202" y="248" width="68" height="30" rx="6" class="exact"/>
  <text x="236" y="267" text-anchor="middle" class="small">exact suffix</text>
  <path d="M58 287 L192 287" stroke="#d29922" stroke-width="1.2"/>
  <path d="M58 283 L58 291 M192 283 L192 291" stroke="#d29922" stroke-width="1.2"/>
  <text x="125" y="305" text-anchor="middle" class="small">whole records only</text>
  <text x="235" y="305" text-anchor="middle" class="small">never selected</text>

  <path d="M292 266 L328 266" class="flow"/>

  <!-- Consolidator -->
  <rect x="330" y="218" width="230" height="96" rx="10" class="engine"/>
  <text x="445" y="242" text-anchor="middle" class="label">CONSOLIDATOR</text>
  <text x="445" y="263" text-anchor="middle" class="body">sees the selected prefix only</text>
  <text x="445" y="282" text-anchor="middle" class="body">writes continuity at its cutoff</text>
  <text x="445" y="301" text-anchor="middle" class="small">retained suffix is absent and untouchable</text>

  <path d="M562 266 L618 266" class="flow"/>

  <!-- Rolled candidate -->
  <rect x="620" y="204" width="240" height="120" rx="10" class="memory"/>
  <text x="638" y="228" class="label">ROLLED CANDIDATE</text>
  <rect x="638" y="244" width="106" height="36" rx="6" class="rolled"/>
  <text x="691" y="259" text-anchor="middle" class="small">consolidated base</text>
  <text x="691" y="272" text-anchor="middle" class="small">older 1 + older 2</text>
  <rect x="750" y="244" width="92" height="36" rx="6" class="exact"/>
  <text x="796" y="259" text-anchor="middle" class="small">exact suffix</text>
  <text x="796" y="272" text-anchor="middle" class="small">unchanged bytes</text>
  <text x="740" y="299" text-anchor="middle" class="body">new checkpoint remains in the exact tail</text>
  <text x="740" y="315" text-anchor="middle" class="small mono">target ≤ 60% of budget</text>

  <!-- Publication -->
  <text x="40" y="361" class="lane">TRANSACTIONAL PUBLICATION</text>
  <rect x="620" y="376" width="240" height="78" rx="10" class="card"/>
  <text x="638" y="401" class="label mono">memory-&lt;generation-id&gt;.md</text>
  <text x="638" y="422" class="body">write · fsync · SHA-256</text>
  <text x="638" y="440" class="small">old pointer remains authoritative</text>

  <path d="M740 326 L740 374" class="flow"/>
  <path d="M618 415 L562 415" class="flow"/>

  <rect x="330" y="376" width="230" height="78" rx="10" class="card"/>
  <text x="348" y="401" class="label mono">state.json</text>
  <text x="348" y="422" class="body">atomically publish new pointer</text>
  <text x="348" y="440" class="small">one generation becomes authoritative</text>

  <path d="M328 415 L287 415" class="flow"/>

  <rect x="40" y="366" width="245" height="98" rx="10" class="memory"/>
  <text x="58" y="390" class="label">ACTIVATE AT A SAFE BOUNDARY</text>
  <text x="58" y="412" class="body">fresh prompt · resume · fork</text>
  <text x="58" y="430" class="body">compaction · rebuild</text>
  <text x="58" y="450" class="small">loads the complete authoritative generation</text>

  <!-- Immediate continuation -->
  <rect x="40" y="484" width="245" height="54" rx="9" class="card"/>
  <text x="58" y="506" class="label">IMMEDIATE CONTINUATION</text>
  <text x="58" y="525" class="body">exact new checkpoint update only</text>
  <path d="M162 466 L162 482" class="muted"/>

  <!-- Canonical source -->
  <rect x="40" y="557" width="820" height="42" rx="9" class="card"/>
  <text x="58" y="582" class="label mono">RAW SESSION JSONL</text>
  <text x="238" y="582" class="body">canonical history · never rewritten · rebuild source</text>
</svg>
